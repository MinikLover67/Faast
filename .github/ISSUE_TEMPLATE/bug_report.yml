name: Bug report
description: Something isn't working
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill in as much as you can.
  - type: input
    id: version
    attributes:
      label: Faast version
      placeholder: "0.1.0 (from About dialog or winget list)"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2 (Build 22631.x)"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Faast
        2. Paste this link: https://example.com/large-file.zip
        3. Click "Add download"
        4. Observe…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      placeholder: Download starts, segmented progress shows, speed > 0
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      placeholder: Stuck at 0%, "Range not supported" toast, no retry button
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / console output
      placeholder: |
        - Open DevTools in the app (Ctrl+Shift+I) → Console tab
        - Run `npm run tauri dev` and check terminal
        - Paste relevant lines here
      render: text
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues (open + closed)
          required: true
        - label: This is not a duplicate
          required: true
        - label: I can reproduce on a clean install
          required: false